[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "skillware"
version = "0.1.0"
description = "Turn AI Engineer talks into evidence-backed Agent Skills."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.scripts]
skillware = "skillware.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skillware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
